services:
  honeypot:
    build: ./openresty
    container_name: reverse-scann
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-9080}:80"
      - "${HTTPS_PORT:-9443}:443"
    volumes:
      - ./data:/data
      - ./certs:/certs
    environment:
      # Tamaño máximo de body que se guarda por request (bytes)
      - CAPTURE_MAX_BODY=${CAPTURE_MAX_BODY:-262144}
      # CN del certificado autofirmado
      - TLS_CN=${TLS_CN:-localhost}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-honeypot}
      - DB_USER=${DB_USER:-honeypot}
      - DB_PASS=${DB_PASS:-honeypot_dev_pass}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    build: ./dashboard
    container_name: reverse-scann-dashboard
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-honeypot}
      - DB_USER=${DB_USER:-honeypot}
      - DB_PASS=${DB_PASS:-honeypot_dev_pass}
    volumes:
      - wordlists:/wordlists   # snapshots diarios del diccionario de vectores
    ports:
      # Solo loopback: inspector web de capturas
      - "127.0.0.1:${DASHBOARD_PORT:-8088}:8000"

  alerter:
    build: ./alerter
    container_name: reverse-scann-alerter
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-honeypot}
      - DB_USER=${DB_USER:-honeypot}
      - DB_PASS=${DB_PASS:-honeypot_dev_pass}
      # Webhook opcional (Slack/Discord/SIEM). Vacío = solo guarda en la tabla alerts.
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_MIN_SEVERITY=${ALERT_MIN_SEVERITY:-high}
      - ALERT_POLL_INTERVAL=${ALERT_POLL_INTERVAL:-5}

  db:
    image: postgres:16-alpine
    container_name: reverse-scann-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-honeypot}
      - POSTGRES_USER=${DB_USER:-honeypot}
      - POSTGRES_PASSWORD=${DB_PASS:-honeypot_dev_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Solo loopback: para conectarse con psql/DBeaver desde la máquina host
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  wordlists:

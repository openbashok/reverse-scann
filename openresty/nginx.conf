# Honeypot HTTP/HTTPS — captura completa de requests + identidad configurable.

worker_processes auto;

# Variables de entorno que Lua necesita leer (os.getenv)
env DB_HOST;
env DB_PORT;
env DB_NAME;
env DB_USER;
env DB_PASS;
env CAPTURE_MAX_BODY;

error_log /usr/local/openresty/nginx/logs/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  text/html;

    # DNS interno de Docker, para que pgmoon resuelva el host "db"
    resolver 127.0.0.11 ipv6=off valid=30s;

    # No delatar el server real; el header Server lo pone persona.lua por request.
    server_tokens off;

    # Perfil activo cacheado (lo comparten todos los workers). Holgado para
    # perfiles con muchas rutas/bodies grandes (ej. catálogo de traps).
    lua_shared_dict persona 16m;

    # Aceptar payloads grandes de scanners; lo que se guarda se trunca en Lua
    client_max_body_size      10m;
    client_body_buffer_size   256k;

    client_header_timeout 30s;
    client_body_timeout   30s;

    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

    init_by_lua_block {
        capture = require "capture"
        persona = require "persona"
    }

    init_worker_by_lua_block {
        persona.init()
    }

    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols       TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;

        # El header Server y los headers extra del perfil activo
        header_filter_by_lua_block {
            persona.set_headers()
        }

        location / {
            access_by_lua_block {
                capture.read_request()
            }
            content_by_lua_block {
                persona.serve()
            }
        }

        log_by_lua_block {
            capture.log_request()
        }
    }
}
